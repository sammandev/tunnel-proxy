worker_processes 1;
pid nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log off;
    server_tokens off;
    client_max_body_size 32m;
    map_hash_bucket_size 64;

    map $http_host $tunnel_bad_host {
        default 1;
        "10.176.2.139:4714" 0;
        "127.0.0.1:4714" 0;
        "localhost:4714" 0;
    }

    map $http_origin $tunnel_bad_origin {
        default 1;
        "" 0;
        "http://10.176.2.139:4714" 0;
        "http://127.0.0.1:4714" 0;
        "http://localhost:4714" 0;
    }

    server {
        listen 127.0.0.1:4714;
        listen 10.176.2.139:4714;
        server_name 10.176.2.139 127.0.0.1 localhost;

        if ($tunnel_bad_host) { return 403; }
        if ($tunnel_bad_origin) { return 403; }

        location /v1/ {
            proxy_pass https://aicc-gateway.pegatroncorp.com/pegaai/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host aicc-gateway.pegatroncorp.com;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Connection "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_ssl_server_name on;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        location = /maas/api/v1/model-status/public/models {
            proxy_pass https://aicc-gateway.pegatroncorp.com/maas/api/v1/model-status/public/models;
            proxy_http_version 1.1;
            proxy_set_header Host aicc-gateway.pegatroncorp.com;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Connection "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_ssl_server_name on;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        location / {
            return 404;
        }
    }
}